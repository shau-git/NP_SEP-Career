name: CI/CD Pipeline - All Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  # 1. Job for Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.5'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Run Unit Tests
        run: npm run test:unit

  # 2. Job for Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.5'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Run Integration Tests
        run: npm run test:api 
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_LIFETIME: ${{ secrets.JWT_LIFETIME }}
          PORT: ${{ secrets.PORT }}

  # 3. Job for Playwright E2E Tests
  playwright-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Create auth directory
      run: mkdir -p tests/ui/auth/.auth
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  # 4. Job for k6 Performance Tests
  k6-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # 1. Install k6 on the GitHub Actions runner machine, as there is something wrong if install from npm
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Run k6 load test
        uses: grafana/run-k6-action@v1
        with:
          path: npm run test:perf