name: 'Start Backend'
description: 'Installs backend dependencies and starts the server'
runs:
  using: "composite"
  steps:
    - name: Install backend dependencies
      run: npm ci
      working-directory: ./backend
      shell: bash

    - name: Start backend server
      run: npm run start &
      working-directory: ./backend
      shell: bash

    - name: Debug port
      run: |
        echo "PORT is: $PORT"
        netstat -tlnp 2>/dev/null || ss -tlnp
      shell: bash
      
    - name: Wait for backend to be ready
      run: npx wait-on tcp://localhost:3000 -t 60000
      shell: bash
    
 