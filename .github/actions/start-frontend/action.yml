name: 'Start Frontend'
description: 'Installs frontend dependencies and starts the server'
runs:
  using: "composite"
  steps:
    - name: Install frontend dependencies
      run: npm ci
      working-directory: ./frontend
      shell: bash

    - name: Start frontend server
      run: npm run start &
      working-directory: ./frontend
      shell: bash

    # npm i -D wait-on
    - name: Wait for frontend to be ready
      run: npx wait-on http://localhost:5173 -t 60000
      shell: bash